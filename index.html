<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANH TÚ ULTRA VIP - Sensitivity OB55</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #070a0f;
            --card-bg: #0d121d;
            --primary-neon: #00ffcc;
            --secondary-neon: #ff0055;
            --accent-yellow: #ffcc00;
            --text-color: #f0f4f8;
            --text-dim: #94a3b8;
            --border-glow: rgba(0, 255, 204, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 14px;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(255, 0, 85, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(0, 255, 204, 0.15) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            border: 2px solid var(--primary-neon);
            box-shadow: 0 0 25px var(--border-glow);
            border-radius: 20px;
            padding: 28px 24px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, var(--secondary-neon), var(--primary-neon), var(--accent-yellow));
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        .app-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 12px var(--primary-neon), 0 0 24px var(--primary-neon);
            line-height: 1.2;
        }

        .app-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            color: var(--secondary-neon);
            letter-spacing: 2px;
            margin-top: 6px;
            font-weight: 800;
        }

        .desc {
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-top: 8px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            font-weight: 700;
            color: var(--primary-neon);
            text-transform: uppercase;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"], select {
            width: 100%;
            background: #06090e;
            border: 1px solid rgba(0, 255, 204, 0.4);
            color: #fff;
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 12px var(--border-glow);
        }

        .os-switch {
            display: flex;
            background: #06090e;
            border-radius: 10px;
            padding: 5px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            gap: 8px;
        }

        .os-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.05rem;
        }

        .os-btn.active {
            background: var(--primary-neon);
            color: #000;
            box-shadow: 0 0 12px var(--primary-neon);
        }

        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #06090e;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid rgba(0, 255, 204, 0.3);
        }

        input[type="range"] {
            flex: 1;
            accent-color: var(--primary-neon);
            cursor: pointer;
            height: 8px;
        }

        .slider-val {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-yellow);
            font-weight: 800;
            font-size: 1.25rem;
            min-width: 55px;
            text-align: right;
        }

        .calc-btn {
            width: 100%;
            background: linear-gradient(45deg, var(--secondary-neon), var(--primary-neon));
            border: none;
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            padding: 16px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            margin: 22px 0;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 18px rgba(0, 255, 204, 0.4);
        }

        .calc-btn:active {
            transform: scale(0.98);
        }

        .results-panel {
            background: #06090f;
            border: 1px dashed var(--primary-neon);
            border-radius: 14px;
            padding: 20px 16px;
        }

        .results-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--secondary-neon);
            text-align: center;
            margin-bottom: 18px;
            font-size: 1.15rem;
            font-weight: 800;
            text-shadow: 0 0 10px var(--secondary-neon);
            letter-spacing: 1px;
        }

        .res-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .res-card {
            background: rgba(255, 255, 255, 0.03);
            border-left: 4px solid var(--primary-neon);
            padding: 14px 12px;
            border-radius: 8px;
            transition: transform 0.2s ease;
        }

        .res-card.highlight {
            border-left-color: var(--secondary-neon);
            background: rgba(255, 0, 85, 0.08);
        }

        .res-label {
            font-size: 0.85rem;
            color: var(--text-dim);
            text-transform: uppercase;
            font-weight: 700;
        }

        .res-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            margin-top: 4px;
        }

        .copy-btn {
            width: 100%;
            background: transparent;
            border: 1px solid var(--accent-yellow);
            color: var(--accent-yellow);
            font-family: 'Orbitron', sans-serif;
            font-weight: 800;
            padding: 12px;
            font-size: 0.95rem;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 16px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .copy-btn:hover {
            background: var(--accent-yellow);
            color: #000;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .app-title { font-size: 1.7rem; }
            .res-value { font-size: 1.3rem; }
            .container { padding: 20px 14px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="app-title">ANH TÚ ULTRA VIP</div>
        <div class="app-subtitle">SENSITIVITY OB55</div>
        <p class="desc">Trình tính toán độ nhạy & nút bắn tối ưu theo từng máy</p>
    </header>

    <div class="form-group">
        <label><i class="fa-solid fa-mobile-screen-button"></i> Tên Thiết Bị / Máy:</label>
        <input type="text" id="deviceName" placeholder="Nhập tên máy (VD: iPhone 13, Poco X3, Red Magic...)" value="iPhone 13 Pro Max" oninput="generateSens()">
    </div>

    <div class="form-group">
        <label><i class="fa-solid fa-microchip"></i> Hệ Điều Hành:</label>
        <div class="os-switch">
            <button type="button" class="os-btn active" id="btnIos" onclick="setOS('ios')">
                <i class="fa-brands fa-apple"></i> iOS
            </button>
            <button type="button" class="os-btn" id="btnAndroid" onclick="setOS('android')">
                <i class="fa-brands fa-android"></i> Android
            </button>
        </div>
    </div>

    <div class="form-group">
        <label><i class="fa-solid fa-hand-pointer"></i> Phong Cách Kéo Tâm:</label>
        <select id="dragStyle" onchange="generateSens()">
            <option value="fast">Kéo nhanh / Tốc độ</option>
            <option value="balanced" selected>Cân bằng / Đa dụng</option>
            <option value="smooth">Ghim tâm / Nhẹ nhàng</option>
        </select>
    </div>

    <div class="form-group">
        <label><i class="fa-solid fa-circle-dot"></i> Kích Thước Nút Bắn Tối Ưu:</label>
        <div class="slider-wrap">
            <input type="range" id="buttonSizeInput" min="10" max="100" value="42" oninput="manualButtonVal(this.value)">
            <span class="slider-val" id="buttonVal">42%</span>
        </div>
    </div>

    <button class="calc-btn" onclick="generateSens()"><i class="fa-solid fa-bolt"></i> TẠO CẤU HÌNH VIP</button>

    <div class="results-panel">
        <div class="results-title"><i class="fa-solid fa-sliders"></i> CẤU HÌNH ĐỘ NHẠY OB55</div>
        
        <div class="res-grid">
            <div class="res-card highlight">
                <div class="res-label">Nhìn Xung Quanh</div>
                <div class="res-value" id="resGeneral">175</div>
            </div>

            <div class="res-card">
                <div class="res-label">Red Dot Sight</div>
                <div class="res-value" id="resRedDot">160</div>
            </div>

            <div class="res-card">
                <div class="res-label">Ống Ngắm 2X</div>
                <div class="res-value" id="res2x">150</div>
            </div>

            <div class="res-card">
                <div class="res-label">Ống Ngắm 4X</div>
                <div class="res-value" id="res4x">140</div>
            </div>

            <div class="res-card highlight">
                <div class="res-label">Nút Bắn</div>
                <div class="res-value" id="resBtnSize">42%</div>
            </div>

            <div class="res-card highlight">
                <div class="res-label" id="osSpecLabel">Con Trỏ Trượt</div>
                <div class="res-value" id="osSpecValue">110</div>
            </div>
        </div>

        <button class="copy-btn" onclick="copyConfig()"><i class="fa-regular fa-copy"></i> SAO CHÉP CẤU HÌNH</button>
    </div>

    <footer>
        <p><i class="fa-solid fa-shield-halved"></i> ANH TÚ ULTRA VIP - Free Fire OB55 Edition</p>
    </footer>
</div>

<script>
    let currentOS = 'ios';

    // Hàm băm chuỗi tên máy ra giá trị số riêng biệt cho từng thiết bị
    function getDeviceHash(str) {
        let hash = 0;
        const cleanStr = str.toLowerCase().replace(/\s+/g, '');
        if (cleanStr.length === 0) return 0;
        for (let i = 0; i < cleanStr.length; i++) {
            const char = cleanStr.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash |= 0;
        }
        return Math.abs(hash);
    }

    function setOS(os) {
        currentOS = os;
        document.getElementById('btnIos').classList.toggle('active', os === 'ios');
        document.getElementById('btnAndroid').classList.toggle('active', os === 'android');
        
        const specLabel = document.getElementById('osSpecLabel');
        specLabel.innerText = (os === 'ios') ? "Con Trỏ Trượt" : "Chỉ Số DPI";
        
        generateSens();
    }

    function manualButtonVal(val) {
        document.getElementById('buttonVal').innerText = val + '%';
        document.getElementById('resBtnSize').innerText = val + '%';
    }

    function generateSens() {
        const rawName = document.getElementById('deviceName').value.trim();
        const style = document.getElementById('dragStyle').value;
        const hash = getDeviceHash(rawName);

        // Nút bắn cơ bản biến thiên từ 36% đến 52% dựa theo mã tên máy
        let autoBtnSize = 36 + (hash % 17);

        // Độ nhạy tổng quan biến thiên từ 150 đến 180 dựa theo mã máy
        let baseGeneral = 150 + (hash % 31);
        
        // DPI biến thiên từ 410 đến 490, Con trỏ biến thiên từ 95 đến 120
        let baseDpi = 410 + (hash % 81);
        let baseCursor = 95 + (hash % 26);

        // Điều chỉnh bổ sung theo tên từ khóa thiết bị
        const lowerName = rawName.toLowerCase();
        if (lowerName.includes('pro max') || lowerName.includes('ultra') || lowerName.includes('pad') || lowerName.includes('tab')) {
            autoBtnSize -= 4; // Màn hình to thì nút bắn nhỏ lại
            baseGeneral += 5;
        } else if (lowerName.includes('rog') || lowerName.includes('gaming') || lowerName.includes('shark') || lowerName.includes('magic')) {
            autoBtnSize -= 2;
            baseGeneral += 10;
            baseDpi += 30;
        }

        // Điều chỉnh theo phong cách kéo tâm
        if (style === 'fast') {
            baseGeneral += 12;
            baseDpi += 25;
            baseCursor += 8;
            autoBtnSize -= 3;
        } else if (style === 'smooth') {
            baseGeneral -= 12;
            baseDpi -= 20;
            baseCursor -= 8;
            autoBtnSize += 4;
        }

        // Giới hạn khoảng hiển thị an toàn
        let finalGeneral = Math.min(Math.max(baseGeneral, 120), 200);
        let finalRedDot = Math.min(Math.max(finalGeneral - (10 + (hash % 8)), 0), 200);
        let final2x = Math.min(Math.max(finalGeneral - (20 + (hash % 8)), 0), 200);
        let final4x = Math.min(Math.max(finalGeneral - (30 + (hash % 8)), 0), 200);
        let finalCursor = Math.min(Math.max(baseCursor, 80), 120);
        let finalBtnSize = Math.min(Math.max(autoBtnSize, 28), 75);

        // Cập nhật lên màn hình giao diện
        document.getElementById('buttonSizeInput').value = finalBtnSize;
        document.getElementById('buttonVal').innerText = finalBtnSize + '%';
        document.getElementById('resBtnSize').innerText = finalBtnSize + '%';

        document.getElementById('resGeneral').innerText = finalGeneral;
        document.getElementById('resRedDot').innerText = finalRedDot;
        document.getElementById('res2x').innerText = final2x;
        document.getElementById('res4x').innerText = final4x;

        if (currentOS === 'ios') {
            document.getElementById('osSpecValue').innerText = finalCursor;
        } else {
            document.getElementById('osSpecValue').innerText = baseDpi + ' DPI';
        }
    }

    function copyConfig() {
        const gen = document.getElementById('resGeneral').innerText;
        const redDot = document.getElementById('resRedDot').innerText;
        const x2 = document.getElementById('res2x').innerText;
        const x4 = document.getElementById('res4x').innerText;
        const btn = document.getElementById('resBtnSize').innerText;
        const specLabel = document.getElementById('osSpecLabel').innerText;
        const specVal = document.getElementById('osSpecValue').innerText;

        const text = `🔥 CẤU HÌNH ANH TÚ ULTRA VIP (OB55) 🔥\n- Nhìn xung quanh: ${gen}\n- Red Dot: ${redDot}\n- Scope 2X: ${x2}\n- Scope 4X: ${x4}\n- Nút bắn: ${btn}\n- ${specLabel}: ${specVal}`;

        navigator.clipboard.writeText(text).then(() => {
            alert('Đã sao chép cấu hình thành công!');
        }).catch(() => {
            alert('Không thể sao chép, vui lòng thử lại.');
        });
    }

    window.onload = function() {
        generateSens();
    };
</script>

</body>
</html>
